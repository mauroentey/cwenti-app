name: Publish Cwenti suite

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle_platform: darwin
            bundle_arch: arm64
            command: npm run dist:mac:arm64
            artifact: macos-arm64
          - os: windows-latest
            bundle_platform: win32
            bundle_arch: x64
            command: npm run dist:win
            artifact: windows-x64

    runs-on: ${{ matrix.os }}
    env:
      CWENTI_BUNDLE_PLATFORM: ${{ matrix.bundle_platform }}
      CWENTI_BUNDLE_ARCH: ${{ matrix.bundle_arch }}
      CSC_LINK: ${{ matrix.bundle_platform == 'darwin' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.bundle_platform == 'darwin' && secrets.CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.bundle_platform == 'darwin' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.bundle_platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.bundle_platform == 'darwin' && secrets.APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ matrix.bundle_platform == 'win32' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.bundle_platform == 'win32' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate tag and package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${{ inputs.release_tag || github.ref_name }}"
          test "$actual" = "$expected"
      - run: npm run download:apps
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Cwenti-release-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish verified installers
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Cwenti ${RELEASE_TAG#v}"
          fi
