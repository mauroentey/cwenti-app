name: Publish Cwenti suite

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle_platform: darwin
            bundle_arch: arm64
            command: npm run dist:mac:arm64
            artifact: macos-arm64
          - os: windows-latest
            bundle_platform: win32
            bundle_arch: x64
            command: npm run dist:win
            artifact: windows-x64

    runs-on: ${{ matrix.os }}
    env:
      CWENTI_BUNDLE_PLATFORM: ${{ matrix.bundle_platform }}
      CWENTI_BUNDLE_ARCH: ${{ matrix.bundle_arch }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Configure available signing credentials
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          write_env() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              return
            fi
            local delimiter="CWENTI_${RANDOM}_${RANDOM}"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
          }

          if [[ "$CWENTI_BUNDLE_PLATFORM" == "darwin" ]]; then
            write_env CSC_LINK "$MAC_CSC_LINK"
            write_env CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            if [[ -n "$MAC_APPLE_ID" &&
                  -n "$MAC_APPLE_APP_SPECIFIC_PASSWORD" &&
                  -n "$MAC_APPLE_TEAM_ID" ]]; then
              write_env APPLE_ID "$MAC_APPLE_ID"
              write_env APPLE_APP_SPECIFIC_PASSWORD "$MAC_APPLE_APP_SPECIFIC_PASSWORD"
              write_env APPLE_TEAM_ID "$MAC_APPLE_TEAM_ID"
            fi
          else
            write_env WIN_CSC_LINK "$WINDOWS_CSC_LINK"
            write_env WIN_CSC_KEY_PASSWORD "$WINDOWS_CSC_KEY_PASSWORD"
          fi
      - run: npm ci
      - name: Validate tag and package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${{ inputs.release_tag || github.ref_name }}"
          test "$actual" = "$expected"
      - run: npm run download:apps
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Cwenti-release-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish verified installers
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Cwenti ${RELEASE_TAG#v}"
          fi
